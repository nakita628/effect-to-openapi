name: release

# Publishes packages/effect-to-openapi to npm and cuts a GitHub release, driven entirely by the
# `version` field of its package.json: bump it on main and, once Test is green for that push,
# the version is tagged, published (only if npm does not have it yet) and released. Nothing
# happens for a push that does not change the version, and every job is safe to re-run.
#
# Action versions are pinned to a commit digest with the tag kept as a comment, the shape
# Renovate's `helpers:pinGitHubActionDigests` maintains.

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      unpublished: ${{ steps.ver.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check version and npm publish state
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version packages/effect-to-openapi/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The root package.json pins pnpm through `devEngines`, which makes npm refuse to run
          # inside the checkout at all: query the registry from an empty directory.
          # A 404 means the package has never been published, which is a valid state.
          STATUS=0
          VERSIONS=$(cd "$RUNNER_TEMP" && npm view effect-to-openapi versions --json) || STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            if [ "$(echo "$VERSIONS" | jq -r '.error.code // empty' 2>/dev/null)" = "E404" ]; then
              VERSIONS='[]'
            else
              echo "::error::Failed to query the npm registry for effect-to-openapi versions. Check https://status.npmjs.org/ and re-run the workflow"
              exit 1
            fi
          fi
          if ! PUBLISHED=$(echo "$VERSIONS" | jq --arg version "$VERSION" '[.] | flatten | index($version) != null'); then
            echo "::error::Unexpected npm registry response. Re-run the workflow"
            exit 1
          fi
          if [ "$PUBLISHED" = "true" ]; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
          else
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          fi

  tag:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create or verify tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          UNPUBLISHED: ${{ needs.check.outputs.unpublished }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          LS_STATUS=0
          git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null || LS_STATUS=$?
          if [ "$LS_STATUS" -eq 2 ]; then
            if [ "$UNPUBLISHED" = "false" ]; then
              echo "::error::effect-to-openapi@$VERSION is already published, but tag v$VERSION does not exist. Cannot safely determine the published commit. Tag the commit that was actually published (git tag v$VERSION <sha> && git push origin v$VERSION), or bump the version and push again"
              exit 1
            fi
            git tag "v$VERSION" "$HEAD_SHA"
            git push origin "v$VERSION"
            exit 0
          fi
          if [ "$LS_STATUS" -ne 0 ]; then
            echo "::error::Failed to query origin for tag v$VERSION (git ls-remote exited with $LS_STATUS). Check connectivity to GitHub and re-run the workflow"
            exit 1
          fi
          git fetch --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          TAG_SHA=$(git rev-parse "v$VERSION^{commit}")
          if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
            echo "tag v$VERSION already points to $HEAD_SHA; skip"
            exit 0
          fi
          if [ "$UNPUBLISHED" = "false" ] && gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already fully released from $TAG_SHA; nothing to do for $HEAD_SHA"
            exit 0
          fi
          echo "::error::v$VERSION already points to another commit ($TAG_SHA, expected $HEAD_SHA). Re-run the release workflow for $TAG_SHA, or bump the version in packages/effect-to-openapi/package.json and push again"
          exit 1

  publish:
    runs-on: ubuntu-latest
    needs: [check, tag]
    if: needs.check.outputs.unpublished == 'true'
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      - run: vp run --filter ./packages/effect-to-openapi build

      # `vp pm publish` forwards to pnpm; the npm provenance attestation comes from the
      # job's `id-token: write` (npm trusted publishing on the `release` environment).
      - run: vp pm publish --filter effect-to-openapi --no-git-checks --provenance

  release:
    runs-on: ubuntu-latest
    needs: [check, tag, publish]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.tag.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 && { echo "release v$VERSION already exists; skip"; exit 0; }
          gh release create "v$VERSION" --verify-tag --generate-notes
